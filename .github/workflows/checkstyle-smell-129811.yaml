name: Checkstyle gate 129811

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, Texas2 ]

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Checkstyle
        uses: checkstyle/action-checkstyle@master
        with:
          file_or_dir: 'src/main/java'
          config_xml: 'checkstyle-129811.xml'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
