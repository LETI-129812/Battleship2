# 129759 - Rodrigo Alves
name: Checkstyle naming gate 129759
on:
  pull_request:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          checkstyle_config: checkstyle-129759.xml
          level: error
          fail_level: error
